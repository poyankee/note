name: Cihaz uyumluluğu

# Elle çalıştırılır (Actions › Cihaz uyumluluğu › Run workflow): uygulamayı farklı Android sürümü
# ve ekran boyutlarında açar, çökmediğini kontrol eder ve ekran görüntüsü alır.
on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 29, profile: pixel_4, name: android10-telefon }
          - { api: 31, profile: Nexus 10, name: android12-tablet }
          - { api: 34, profile: pixel_tablet, name: android14-tablet }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK derle
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Aç ve kontrol et
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.poyankee.note.debug/com.poyankee.note.MainActivity
            sleep 12
            mkdir -p out
            adb exec-out screencap -p > out/${{ matrix.name }}-ana-sayfa.png
            adb shell pidof com.poyankee.note.debug
            adb shell input keyevent KEYCODE_ROTATE 2>/dev/null || true
            adb shell settings put system user_rotation 1
            sleep 5
            adb exec-out screencap -p > out/${{ matrix.name }}-yatay.png
            adb shell pidof com.poyankee.note.debug
            adb logcat -d -b crash > out/${{ matrix.name }}-crash.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cihaz-${{ matrix.name }}
          path: out/
