name: Emülatör testi

on:
  push:
    branches-ignore: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test APK'larını derle
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Tablet emülatöründe duman testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global overlay_display_devices 1280x720/213
            adb shell pm disable-user --user 0 com.google.android.inputmethod.latin || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d > logcat.txt; adb pull /data/local/tmp/shots shots; exit 1)
            adb pull /data/local/tmp/shots shots || true
      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
      - name: Ekran görüntülerini "screenshots" dalına yükle
        if: always()
        run: |
          if [ -d shots ]; then
            cd shots
            git init -q
            git checkout -q -b screenshots
            git add .
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ekran görüntüleri ${{ github.sha }}"
            git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} screenshots
          fi
