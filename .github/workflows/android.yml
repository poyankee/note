name: Android APK

on:
  push:
    branches-ignore: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK derle
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:bundleRelease
      - name: APK dosyalarını adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Note-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Note-debug-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Note-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Note-apk-${{ github.run_number }}
          path: |
            out/*.apk
            out/*.aab
      - name: Tablete kolay indirme için sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Note sürüm ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Tablete kurmak için **Note-${{ github.run_number }}.apk** dosyasını indirip açın.
            Önceki sürümün üzerine kurulur, defterleriniz silinmez.
          files: out/Note-${{ github.run_number }}.apk
