name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK derle
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
      - name: APK dosyalarını adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Note-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Note-debug-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Note-apk-${{ github.run_number }}
          path: out/*.apk
